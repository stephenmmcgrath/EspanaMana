<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>España Mana</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="icon.png">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header>
            <div class="score">★ <span id="score-display">0</span></div>
            <h1 class="app-title">España Mana</h1>
            <button id="btn-settings" class="icon-btn">⚙️</button>
        </header>

        <!-- Main Game Area -->
        <main id="game-screen">
            <div class="card-container">
                <div id="word-display" class="glowing-text">Cargando...</div>
                <div id="meaning-display" class="hidden"></div>
            </div>

            <div class="controls">
                <button id="btn-speak" class="action-btn">🔊 Escuchar</button>
                
                <div id="initial-actions">
                    <button id="btn-show-answer" class="primary-btn">Show Answer</button>
                </div>

                <div id="feedback-actions" class="hidden">
                    <button id="btn-incorrect" class="danger-btn">Incorrect</button>
                    <button id="btn-correct" class="success-btn">Correct</button>
                </div>
            </div>
        </main>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Settings</h2>
                
                <div class="setting-group">
                    <label for="difficulty-select">Difficulty</label>
                    <select id="difficulty-select">
                        <option value="Simple">Simple</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Difficult">Difficult</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label class="toggle-label">
                        <span>Haptic Feedback</span>
                        <input type="checkbox" id="toggle-haptic" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="setting-group">
                    <label class="toggle-label">
                        <span>Sound Effects</span>
                        <input type="checkbox" id="toggle-sound" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <button id="btn-close-settings" class="primary-btn">Close & Apply</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
